<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Number Arena: Decimals &amp; Fractions</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&family=Lalezar&family=Lilita+One&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#d9efff;--bg2:#bfe3ff;--panel:#ffffff;--panel2:#eef6ff;--ink:#132046;--muted:#4b5b80;--line:#132046;--dk:#0b1236;
  --blue:#2f6bff;--orange:#ff8a24;--green:#27c768;--yellow:#ffc619;--pink:#ff5f9e;--purple:#7b4dff;--cyan:#22c7ee;--red:#e5383b;
  --okbg:#c8f6d6;--nobg:#ffd9d9;--warnbg:#fff0b8;--hi:#fff7d1;
  --fd:'Lilita One','Lalezar','Arial Rounded MT Bold','Trebuchet MS',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1446;--bg2:#171e63;--panel:#212a7a;--panel2:#1a2168;--ink:#f3f5ff;--muted:#bcc4f7;--line:#04061f;--okbg:#12613a;--nobg:#7a2330;--warnbg:#6b5a0e;--hi:#3a3f9a}
}
:root[data-theme="dark"]{--bg:#0f1446;--bg2:#171e63;--panel:#212a7a;--panel2:#1a2168;--ink:#f3f5ff;--muted:#bcc4f7;--line:#04061f;--okbg:#12613a;--nobg:#7a2330;--warnbg:#6b5a0e;--hi:#3a3f9a}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2','Baloo Bhaijaan 2','Trebuchet MS','Segoe UI',Tahoma,system-ui,sans-serif;font-weight:600;font-size:17px;line-height:1.35;min-height:100vh}
h1,h2,h3,.disp,.btn,.chip,.inp{font-family:var(--fd);font-weight:400}
h1,h2,h3,p{margin:0}
h1{font-size:clamp(2.4rem,9vw,4rem);line-height:1}
h2{font-size:1.7rem;line-height:1.1}
h3{font-size:1.25rem}
#app{max-width:940px;margin:0 auto;padding:12px 14px 70px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:4px solid var(--purple);outline-offset:2px}
.muted{color:var(--muted)}
.sp{flex:1}

/* top bar */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{background:var(--panel);border:3px solid var(--line);border-radius:999px;padding:3px 12px;display:inline-flex;align-items:center;gap:6px;font-size:1rem;color:var(--ink)}
button.chip{box-shadow:0 3px 0 var(--line)}
button.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chip.rk{background:var(--yellow);color:var(--dk)}

/* buttons */
.btn{border:3px solid var(--line);border-radius:16px;padding:10px 18px;font-size:1.1rem;box-shadow:0 5px 0 var(--line);background:var(--blue);color:#fff;transition:transform .08s,box-shadow .08s;min-height:46px}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.b-blue{background:var(--blue);color:#fff}
.b-purple{background:var(--purple);color:#fff}
.b-red{background:var(--red);color:#fff}
.b-orange{background:var(--orange);color:var(--dk)}
.b-green{background:var(--green);color:var(--dk)}
.b-yellow{background:var(--yellow);color:var(--dk)}
.b-pink{background:var(--pink);color:var(--dk)}
.b-cyan{background:var(--cyan);color:var(--dk)}
.b-plain{background:var(--panel);color:var(--ink)}
.big{font-size:1.5rem;padding:14px 26px;border-radius:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}
.back{margin:0 0 12px}

/* cards */
.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 6px 0 var(--line)}
.card+.card{margin-top:18px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:18px}
.pill{display:inline-block;border:2px solid var(--line);border-radius:999px;padding:0 10px;font-size:.85rem;background:var(--hi);color:var(--ink)}

/* hero */
.hero{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:18px;align-items:center;background:var(--bg2);border:3px solid var(--line);border-radius:30px;padding:18px;box-shadow:0 6px 0 var(--line)}
.hero .sub{font-size:1.15rem;margin:8px 0 14px;max-width:32ch}
.mascot{position:relative}
.bot{width:100%;max-width:200px;display:block;margin:0 auto;animation:bob 3s ease-in-out infinite}
.bubble{background:var(--panel);border:3px solid var(--line);border-radius:18px;padding:8px 12px;font-size:.95rem;margin-top:8px;position:relative;text-align:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media (max-width:560px){.hero{grid-template-columns:1fr;text-align:center}.hero .sub{margin-inline:auto}}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-top:20px}
.tile{border:3px solid var(--line);border-radius:22px;padding:14px;text-align:left;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:2px;min-height:118px;text-align:start;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(5px);box-shadow:0 1px 0 var(--line)}
.tile .em{font-size:2rem;line-height:1}
.tile h3{color:inherit}
.tile small{font-size:.95rem;font-weight:700;opacity:.9}
.tile.b-blue,.tile.b-purple{color:#fff}
.tile.b-orange,.tile.b-pink,.tile.b-green,.tile.b-yellow,.tile.b-cyan{color:var(--dk)}

/* map */
.world{border:3px solid var(--line);border-radius:24px;background:var(--panel);box-shadow:0 6px 0 var(--line);overflow:hidden}
.world+.world{margin-top:18px}
.world.locked{opacity:.7}
.wh{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:3px solid var(--line)}
.wh .em{font-size:2rem;line-height:1}
.wh h3{color:inherit}
.wh small{font-weight:700}
.wh.b-blue,.wh.b-purple{color:#fff}
.wh.b-orange,.wh.b-pink,.wh.b-green,.wh.b-cyan{color:var(--dk)}
.wb{display:flex;gap:10px;flex-wrap:wrap;padding:14px 16px;align-items:stretch}
.node{flex:1 1 130px;border:3px solid var(--line);border-radius:18px;background:var(--panel2);padding:8px 10px;text-align:center;box-shadow:0 4px 0 var(--line);color:var(--ink)}
.node:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.node[disabled]{opacity:.55;cursor:not-allowed}
.node b{display:block;font-family:var(--fd);font-weight:400;font-size:1.05rem}
.stars{font-size:1.3rem;letter-spacing:2px;color:#e39b00}
.node .stars{font-size:1.15rem}

/* lesson */
.lesson h2{margin-bottom:8px}
.keys{margin:10px 0 0;padding-inline-start:1.3em;padding-left:0}
.keys li{margin:6px 0}
.pvt{border-collapse:separate;border-spacing:6px;margin:12px 0}
.pvt td,.pvt th{border:3px solid var(--line);border-radius:12px;text-align:center;padding:4px 10px;min-width:56px;font-family:var(--fd);font-weight:400}
.pvt th{background:var(--yellow);color:var(--dk);font-size:.85rem}
.pvt td{font-size:1.6rem;background:var(--panel2)}
.pvt td.dot{border:none;background:none;min-width:20px;padding:0;font-size:2rem}
.stage{border:3px solid var(--line);border-radius:16px;padding:10px 12px;margin-top:12px;background:var(--panel2)}
.stage.now{background:var(--hi);box-shadow:0 4px 0 var(--line)}
.stage .say{margin-bottom:6px}
.calc{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;line-height:1.7}
.vert{display:inline-block;padding:6px 8px}
.vr{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.35rem;line-height:1.35;text-align:left}
.vr .sg{display:inline-block;width:1.6ch;color:var(--pink)}
.vr em{font-style:normal;color:var(--orange)}
.vr u{text-decoration:none;color:var(--purple);background:var(--hi);border-radius:4px}
.vr.res{border-top:3px solid var(--ink);margin-top:2px}
.scroll-x{overflow-x:auto;max-width:100%}
.tips li{margin:6px 0}
.trap{background:var(--nobg)}
.trick{background:var(--okbg)}
.kcf b{padding:0 6px;border-radius:8px;border:2px solid var(--line);color:var(--dk)}
.kcf .k{background:var(--green)}.kcf .c{background:var(--orange)}.kcf .f{background:var(--pink)}
svg.area{width:min(260px,80%);height:auto;display:block;margin:8px 0}
svg.area rect{stroke:var(--line);stroke-width:2}
.area .c0{fill:var(--panel)}.area .cc{fill:var(--blue);fill-opacity:.55}.area .cr{fill:var(--orange);fill-opacity:.6}.area .cb{fill:var(--green);fill-opacity:.95}

/* fractions */
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .18em;line-height:1.05;font-family:var(--fd);font-weight:400}
.fr i{font-style:normal;padding:0 .3em}
.fr i:first-child{border-bottom:.11em solid currentColor}
.mix{display:inline-flex;align-items:center;gap:.05em;font-family:var(--fd);font-weight:400}

/* quiz */
.qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dots{display:flex;gap:6px;flex:1;min-width:120px}
.dots span{flex:1;height:12px;border:3px solid var(--line);border-radius:8px;background:var(--panel)}
.dots span.d{background:var(--green)}.dots span.x{background:var(--red)}.dots span.n{background:var(--yellow)}
.bar{height:16px;border:3px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;flex:1;min-width:120px}
.bar i{display:block;height:100%;background:var(--orange);width:100%;transition:width .2s linear}
.qcard{padding:18px}
.badge{display:inline-block;background:var(--purple);color:#fff;border-radius:999px;padding:0 12px;font-family:var(--fd);font-weight:400;font-size:.9rem;margin-bottom:8px}
.wp{font-size:1.25rem;line-height:1.45;margin-bottom:6px}
.expr{font-family:var(--fd);font-weight:400;font-size:clamp(1.7rem,7vw,2.6rem);margin:8px 0 14px}
.inp{font-size:1.6rem;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--panel);color:var(--ink);width:min(230px,58vw);text-align:center}
.fin{display:inline-flex;align-items:center;gap:10px}
.fin .inp{width:78px;padding:6px 4px}
.fin .stack{display:flex;flex-direction:column;align-items:center;gap:5px}
.fin .hr{width:78px;height:5px;background:var(--ink);border-radius:3px}
.unit{font-size:1.2rem;margin-inline-start:8px}
.msg{min-height:1.6em;margin:10px 0 0;font-size:1.05rem}
.msg.warn{color:var(--muted)}
.fb{border:3px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:6px}
.fb.ok{background:var(--okbg)}.fb.no{background:var(--nobg)}
.fb h3{margin-bottom:4px}
details.steps{margin-top:10px;border:3px solid var(--line);border-radius:14px;background:var(--panel);padding:8px 12px}
details.steps summary{cursor:pointer;font-family:var(--fd);font-weight:400}
details.steps ol{padding-inline-start:1.3em;padding-left:0;margin:8px 0 0}
details.steps li{margin:8px 0}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pl{display:flex;gap:10px;margin-bottom:12px}
.pl>div{flex:1;border:3px solid var(--line);border-radius:16px;padding:6px 10px;background:var(--panel);text-align:center}
.pl>div.on{background:var(--yellow);color:var(--dk);box-shadow:0 4px 0 var(--line)}
.pl b{font-family:var(--fd);font-weight:400;font-size:1.3rem;display:block}
.live{list-style:none;padding:0;margin:8px 0 0}
.live li{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:2px dashed var(--muted)}
.live li:last-child{border-bottom:none}
.rankn{width:1.6em;text-align:center;font-family:var(--fd);font-weight:400}

/* forms */
label.lb{display:block;margin:12px 0 4px;font-family:var(--fd);font-weight:400}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg .btn{padding:6px 14px;font-size:1rem;box-shadow:0 3px 0 var(--line)}
.seg .btn.sel{background:var(--yellow);color:var(--dk)}
.txt{font:inherit;font-weight:700;border:3px solid var(--line);border-radius:14px;padding:8px 12px;background:var(--panel);color:var(--ink);width:100%;max-width:340px}
.avs{display:flex;gap:8px;flex-wrap:wrap}
.avs button{font-size:1.7rem;width:52px;height:52px;border:3px solid var(--line);border-radius:14px;background:var(--panel2)}
.avs button.sel{background:var(--yellow);box-shadow:0 4px 0 var(--line)}

/* trophies */
.rankbar{height:22px;border:3px solid var(--line);border-radius:12px;background:var(--panel2);overflow:hidden;margin:8px 0}
.rankbar i{display:block;height:100%;background:var(--green)}
.trophies{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.tro{border:3px solid var(--line);border-radius:16px;padding:10px;background:var(--panel2);text-align:center}
.tro .em{font-size:2rem}
.tro.off{opacity:.45;filter:grayscale(1)}
.tro small{display:block;font-weight:700;color:var(--muted)}
table.lt{width:100%;border-collapse:collapse}
table.lt td,table.lt th{padding:6px 8px;border-bottom:2px dashed var(--muted);text-align:start}
table.lt th{font-family:var(--fd);font-weight:400}

/* trivia + fun */
.opts{display:grid;gap:10px;margin-top:12px}
.opts .btn{text-align:start}
.opts .btn.right{background:var(--green);color:var(--dk)}
.opts .btn.wrong{background:var(--red);color:#fff}
.joke{font-size:1.3rem}

/* toast + confetti */
#toast{position:fixed;left:50%;top:12px;transform:translate(-50%,-140%);background:var(--yellow);color:var(--dk);border:3px solid var(--line);border-radius:16px;padding:8px 16px;font-family:var(--fd);box-shadow:0 5px 0 var(--line);z-index:50;transition:transform .25s;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40}
.cf{position:absolute;width:11px;height:16px;border:2px solid var(--line);border-radius:3px;animation:cf 1.3s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* language: Arabic / RTL */
html[lang="ar"] body{line-height:1.6;font-size:18px}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.3}
.expr,.vert,.calc,.fin,.fr,.mix,.pvt,svg.area,.inp,#ccode,bdi[dir="ltr"]{direction:ltr;unicode-bidi:isolate}
.expr{text-align:center}
.calcx{font-size:1.05rem;line-height:1.9}
.calcx.kcf b{margin-inline:2px}
html[dir="rtl"] .vr{direction:ltr}
html[dir="rtl"] .pl b,html[dir="rtl"] .chip{unicode-bidi:plaintext}
</style>
</head>
<body>
<noscript>Number Arena needs JavaScript to run.</noscript>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-hidden="true"></div>
<script>
(function(){
'use strict';

/* ================= utilities ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtN=n=>Number(n||0).toLocaleString('en-US');
const rid=()=>'p'+Math.random().toString(36).slice(2,10);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0}
function makeRng(seed){const f=mulberry32(seed);return{int:(a,b)=>a+Math.floor(f()*(b-a+1)),pick:a=>a[Math.floor(f()*a.length)],shuffle:a=>{const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(f()*(i+1));[r[i],r[j]]=[r[j],r[i]]}return r}}}
const newRng=()=>makeRng((Math.random()*4294967296)>>>0);

/* ================= storage ================= */
const mem={};
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return k in mem?mem[k]:d}},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let DB=store.get('na_db',null);
if(!DB||!DB.profiles)DB={cur:null,profiles:{},hall:[],prefs:{}};
DB.prefs=Object.assign({theme:'auto',music:true,sfx:true,teacher:false,code:'',lang:((typeof navigator!=='undefined'&&navigator.language)||'en').slice(0,2)==='ar'?'ar':'en'},DB.prefs||{});
let P=DB.cur&&DB.profiles[DB.cur]?DB.profiles[DB.cur]:null;
const save=()=>store.set('na_db',DB);
const AVATARS=['🤖','⚽','🚀','🦁','🐯','🦅','🐉','🦈','🎮','🏎️','🧠','⚡'];
function newProfile(name,avatar){const id=rid();DB.profiles[id]={id,name:name.slice(0,16),avatar,points:0,stars:{},badges:[],blitz:0,solved:0,correct:0,seen:{}};DB.cur=id;P=DB.profiles[id];save()}
function applyTheme(){const t=DB.prefs.theme;if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}

/* ================= language ================= */
const isAr=()=>DB.prefs.lang==='ar';
const X=(en,ar)=>isAr()?ar:en;
const li=()=>isAr()?1:0;
const eq=s=>'<bdi dir="ltr">'+s+'</bdi>';
function applyLang(){
  document.documentElement.lang=isAr()?'ar':'en';
  document.documentElement.dir=isAr()?'rtl':'ltr';
  document.title=X('Number Arena: Decimals & Fractions','ساحة الأرقام: الأعداد العشرية والكسور');
}
/* turn Arabic-Indic / Persian digits and Arabic separators into plain digits */
const normDigits=s=>String(s==null?'':s).replace(/[\u0660-\u0669]/g,c=>c.charCodeAt(0)-1632).replace(/[\u06F0-\u06F9]/g,c=>c.charCodeAt(0)-1776).replace(/[\u066B\u060C]/g,'.');

/* ================= game data ================= */
function W(id,n,em,color,op,cat){return{id,em,color,cat,get n(){return n[li()]},get op(){return op[li()]}}}
const WORLDS=[
  W('add',['Decimal Docks','ميناء الجمع'],'➕','blue',['Adding decimals','جمع الأعداد العشرية'],'dec'),
  W('sub',['Subtract Summit','قمة الطرح'],'➖','orange',['Subtracting decimals','طرح الأعداد العشرية'],'dec'),
  W('mul',['Times Tower','برج الضرب'],'✖️','purple',['Multiplying decimals','ضرب الأعداد العشرية'],'dec'),
  W('div',['Split Canyon','وادي القسمة'],'➗','pink',['Dividing decimals','قسمة الأعداد العشرية'],'dec'),
  W('fmul',['Fraction Forge','مصنع الكسور'],'🔨','green',['Multiplying fractions','ضرب الكسور'],'frac'),
  W('fdiv',['Flip Fortress','حصن المقلوب'],'🏰','cyan',['Dividing fractions','قسمة الكسور'],'frac')
];
const LEVELS=[{n:['Rookie','مبتدئ'],mult:1},{n:['Pro','محترف'],mult:1.5},{n:['Legend','أسطورة'],mult:2}];
const RANKS=[
  {p:0,n:['Rookie','مبتدئ']},{p:500,n:['Number Ninja','نينجا الأرقام']},{p:1500,n:['Fraction Knight','فارس الكسور']},
  {p:3500,n:['Decimal Commander','قائد الأعداد العشرية']},{p:7000,n:['Math Legend','أسطورة الرياضيات']}
];
function rankOf(pts){let i=0;RANKS.forEach((r,k)=>{if(pts>=r.p)i=k});const cur=RANKS[i],nx=RANKS[i+1];return{cur,nx,pct:nx?Math.round((pts-cur.p)/(nx.p-cur.p)*100):100}}
const BADGES={
  first:['🌟',['First Steps','الخطوات الأولى'],['Finish your first level','أنهِ أول مستوى']],
  streak5:['🔥',['On Fire','مشتعل'],['Get 5 correct in a row','أجب 5 إجابات صحيحة متتالية']],
  perfect:['💯',['Perfect Score','العلامة الكاملة'],['Get 5 out of 5 in a level','احصل على 5 من 5 في مستوى']],

/* ================= decimal helpers ================= */
const dv=(v,p)=>({v,p});
const P10=n=>Math.pow(10,n);
function dstr(d){const s=String(Math.abs(d.v)).padStart(d.p+1,'0');return d.p?s.slice(0,-d.p)+'.'+s.slice(-d.p):s}
function norm(d){let v=d.v,p=d.p;while(p>0&&v%10===0){v/=10;p--}return dv(v,p)}
function rdec(R,p,lo,hi){let v;do{v=R.int(lo*P10(p),hi*P10(p)-1)}while(p>0&&v%10===0);return dv(v,p)}
function addD(a,b){const p=Math.max(a.p,b.p);return dv(a.v*P10(p-a.p)+b.v*P10(p-b.p),p)}
function subD(a,b){const p=Math.max(a.p,b.p);return dv(a.v*P10(p-a.p)-b.v*P10(p-b.p),p)}
function eqD(a,b){return a.v*P10(b.p)===b.v*P10(a.p)}
function parseDec(s){s=String(s).trim().replace(',','.');if(!/^(\d+\.?\d*|\.\d+)$/.test(s))return null;const parts=s.split('.');const f=parts[1]||'';if(f.length>6||parts[0].length>9)return null;return dv(parseInt((parts[0]||'0')+f,10),f.length)}
function vert(nums,op,res,ghost){
  if(ghost===undefined)ghost=true;
  const all=res?nums.concat([res]):nums;
  const Pm=Math.max.apply(null,all.map(d=>d.p));
  const parts=all.map(d=>{const s=dstr(d).split('.');return{i:s[0],f:s[1]||''}});
  const IW=Math.max.apply(null,parts.map(x=>x.i.length));
  const NB='\u00a0';
  const rows=parts.map((x,k)=>{
    const isRes=!!res&&k===parts.length-1;
    const sign=(k===nums.length-1&&!isRes)?op:'';
    const need=Pm-x.f.length;
    const dot=Pm>0&&(x.f.length>0||ghost)?'<em>.</em>':NB;
    const fz=need>0?(ghost?'<u>'+'0'.repeat(need)+'</u>':NB.repeat(need)):'';
    return '<div class="vr'+(isRes?' res':'')+'"><span class="sg">'+sign+'</span>'+x.i.padStart(IW,NB)+dot+x.f+fz+'</div>';
  });
  return '<div class="scroll-x"><div class="vert">'+rows.join('')+'</div></div>';
}

const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const frac=(n,d)=>{const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const frH=(n,d)=>'<span class="fr"><i>'+n+'</i><i>'+d+'</i></span>';
const impF=f=>f.n===0?{n:f.w,d:1}:{n:f.w*f.d+f.n,d:f.d};
function showF(f){if(f.n===0)return '<b>'+f.w+'</b>';if(f.w===0)return frH(f.n,f.d);return '<span class="mix"><b>'+f.w+'</b>'+frH(f.n,f.d)+'</span>'}
function ansH(a){if(a.d===1)return '<b>'+a.n+'</b>';if(a.n>a.d){const w=Math.floor(a.n/a.d),r=a.n%a.d;return r?'<span class="mix"><b>'+w+'</b>'+frH(r,a.d)+'</span>':'<b>'+w+'</b>'}return frH(a.n,a.d)}
function rFrac(R,dmax){let d,n;do{d=R.int(2,dmax);n=R.int(1,d-1)}while(gcd(n,d)!==1);return{w:0,n,d}}
function rMix(R,dmax){const f=rFrac(R,dmax);f.w=R.int(1,3);return f}

function genAdd(R,lv,word){

function genSub(R,lv,word){
  let nums;
  if(lv===1)nums=[rdec(R,1,6,20),rdec(R,1,1,5)];
  else if(lv===2)nums=[rdec(R,R.int(1,2),10,50),rdec(R,2,1,9)];
  else if(word&&R.int(0,1))nums=[R.int(0,1)?dv(R.int(30,90),0):rdec(R,1,40,90),rdec(R,2,1,9),rdec(R,1,1,9)];
  else nums=[R.int(0,1)?dv(R.int(10,60),0):rdec(R,2,20,99),rdec(R,R.int(2,3),1,9)];
  const ans=nums.reduce((s,x)=>subD(s,x));
  const strs=nums.map(dstr);
  const q={kind:'dec',ans:norm(ans),unit:'',dbg:{op:'-',nums}};
  if(word){const t=R.pick(nums.length===2?SUB2:SUB3);q.text=t.t[li()](pickName(R),strs);q.unit=t.u[li()]}
  else q.expr=strs.join(' − ')+' = ?';
  q.hint=word?X('Words like <b>left</b>, <b>remaining</b> and <b>how much faster</b> mean SUBTRACT. Big number on top!','كلمات مثل <b>بقي</b> و<b>الباقي</b> و<b>بكم أسرع</b> تعني اطرح. العدد الأكبر في الأعلى!')
    :X('Put the bigger number on top, line up the decimal points, add zeros, then subtract from the right.','ضع العدد الأكبر في الأعلى، وحاذِ الفواصل العشرية، وأضف أصفارًا، ثم اطرح من اليمين.');
  if(nums.length===2){
    q.steps=[X('Stack the numbers with the bigger one on top and line up the <b>decimal points</b>. Fill empty places with zeros.','اكتب العدد الأكبر في الأعلى وضع <b>الفواصل العشرية</b> في عمود واحد. املأ الخانات الفارغة بأصفار.')+vert(nums,'−'),
      X('Subtract column by column from the right. If a top digit is too small, borrow 1 from the column on its left.','اطرح عمودًا عمودًا من اليمين. إذا كان الرقم العلوي أصغر فاستلف 1 من العمود الذي على يساره.'),
      X('Bring the decimal point straight down: <b>'+dstr(q.ans)+'</b>.','أنزل الفاصلة العشرية مباشرة إلى الأسفل: <b>'+dstr(q.ans)+'</b>.')+vert(nums,'−',ans),
      X('Check by adding: ','تحقق بالجمع: ')+eq(dstr(q.ans)+' + '+dstr(nums[1])+' = '+dstr(nums[0]))+'.'];
  }else{
    const r1=subD(nums[0],nums[1]);
    q.steps=[X('Subtract in two steps. First: ','اطرح على خطوتين. أولًا: ')+eq(dstr(nums[0])+' − '+dstr(nums[1]))+'.'+vert([nums[0],nums[1]],'−',r1),
      X('Then take away the last number: ','ثم اطرح العدد الأخير: ')+eq(dstr(r1)+' − '+dstr(nums[2]))+'.'+vert([r1,nums[2]],'−',ans),
      X('The answer is <b>'+dstr(q.ans)+'</b>.','الجواب هو <b>'+dstr(q.ans)+'</b>.')];
  }
  return q;
}

function genMul(R,lv,word){
  let a,b;
  if(lv===1){a=rdec(R,1,1,9);b=dv(R.int(2,9),0)}
  else if(lv===2){const t=R.int(0,2);if(t===0){a=rdec(R,1,1,9);b=rdec(R,1,1,9)}else if(t===1){a=rdec(R,2,1,9);b=dv(R.int(3,12),0)}else{a=rdec(R,1,0,1);b=rdec(R,1,1,9)}}
  else{const t=R.int(0,2);if(t===0){a=rdec(R,2,1,9);b=rdec(R,1,1,9)}else if(t===1){a=rdec(R,2,0,1);b=rdec(R,1,0,1)}else{a=rdec(R,1,2,15);b=rdec(R,2,1,9)}}
  const prod=dv(a.v*b.v,a.p+b.p);
  const q={kind:'dec',ans:norm(prod),unit:'',dbg:{op:'*',nums:[a,b]}};
  const both1=a.v<P10(a.p)&&b.p>0&&b.v<P10(b.p);
  if(word){
    const t=b.p===0?R.pick(MULW):both1?MULA:R.pick(MULD);
    q.text=t.t[li()](pickName(R),dstr(a),dstr(b));q.unit=t.u[li()];
  }else q.expr=dstr(a)+' × '+dstr(b)+' = ?';
  q.hint=word?X('Words like <b>each</b>, <b>per</b>, <b>area</b> and <b>times</b> point to MULTIPLY. Ignore the points first, then count decimal places.','كلمات مثل <b>كل</b> و<b>سعر الكيلوجرام</b> و<b>المساحة</b> تشير إلى الضرب. أهمل الفواصل أولًا ثم عُدّ المنازل العشرية.')
    :X('Multiply like whole numbers, then count the decimal places in both numbers.','اضرب كأنها أعداد صحيحة، ثم عُدّ المنازل العشرية في العددين.');
  const ra=Math.round(a.v/P10(a.p)),rb=Math.round(b.v/P10(b.p));
  const est=(a.v/P10(a.p)>=1&&b.v/P10(b.p)>=1)?X('Sense check: about '+ra+' × '+rb+' = '+(ra*rb)+', so the answer should be close to that.','فحص سريع: تقريبًا '+eq(ra+' × '+rb+' = '+(ra*rb))+'، فيجب أن يكون الجواب قريبًا من ذلك.')
    :X('Sense check: multiplying by a number smaller than 1 makes the answer smaller.','فحص سريع: الضرب في عدد أصغر من 1 يجعل الناتج أصغر.');
  const k=a.p+b.p;
  q.steps=[X('Ignore the decimal points and multiply like whole numbers: <b>'+a.v+' × '+b.v+' = '+(a.v*b.v)+'</b>.','أهمل الفواصل العشرية واضرب كأنها أعداد صحيحة: <b>'+eq(a.v+' × '+b.v+' = '+(a.v*b.v))+'</b>.'),
    X('Count the decimal places: '+dstr(a)+' has <b>'+a.p+'</b> and '+dstr(b)+' has <b>'+b.p+'</b>, so <b>'+k+'</b> altogether.','عُدّ المنازل العشرية: في '+eq(dstr(a))+' عدد <b>'+a.p+'</b> وفي '+eq(dstr(b))+' عدد <b>'+b.p+'</b>، فالمجموع <b>'+k+'</b>.'),
    X('Start at the right end of '+(a.v*b.v)+' and move the point '+k+' place'+(k===1?'':'s')+' to the left (add zeros in front if you need them): <b>'+dstr(prod)+'</b>'+(q.ans.p!==prod.p?', which is <b>'+dstr(q.ans)+'</b> without the extra zero.':'.'),
      'ابدأ من يمين '+eq(String(a.v*b.v))+' وحرّك الفاصلة '+k+' من المنازل إلى اليسار (وأضف أصفارًا في المقدمة إذا احتجت): <b>'+dstr(prod)+'</b>'+(q.ans.p!==prod.p?'، أي <b>'+dstr(q.ans)+'</b> بدون الصفر الزائد.':'.')),
    est];
  return q;
}

function shiftD(N,k){return N.p>=k?dv(N.v,N.p-k):dv(N.v*P10(k-N.p),0)}
function genDiv(R,lv,word){
  let D,Q;
  if(lv===1){D=dv(R.int(2,9),0);Q=rdec(R,1,1,9)}
  else if(lv===2){if(R.int(0,1)){D=dv(R.int(2,9),1);Q=dv(R.int(3,40),0)}else{D=dv(R.int(3,9),0);Q=rdec(R,R.int(1,2),1,9)}}
  else{const t=word?R.int(0,1):R.int(0,2);
    if(t===0){D=dv(R.pick([4,5,8,12,15,25,35,75]),2);Q=dv(R.int(4,60),0)}
    else if(t===1){D=dv(R.int(3,12),0);Q=rdec(R,2,1,20)}
    else{D=dv(R.pick([4,5,8,12,15,25]),2);Q=rdec(R,1,1,9)}}
  const N=norm(dv(D.v*Q.v,D.p+Q.p));
  const q={kind:'dec',ans:norm(Q),unit:'',dbg:{op:'/',nums:[N,D]}};
  if(word){const t=R.pick(D.p===0?DIVW:DIVD);q.text=t.t[li()](pickName(R),dstr(N),dstr(D));q.unit=t.u[li()]}
  else q.expr=dstr(N)+' ÷ '+dstr(D)+' = ?';
  q.hint=word?X('<b>Shared equally</b> or <b>how many fit</b> means DIVIDE. Make the divisor a whole number first!','<b>بالتساوي</b> أو <b>كم مرة يتسع</b> تعني اقسم. اجعل المقسوم عليه عددًا صحيحًا أولًا!')
    :X('If the divisor has a decimal point, move it to the right until it is whole. Move the dividend\'s point the same number of places.','إذا كان في المقسوم عليه فاصلة فحرّكها يمينًا حتى يصير عددًا صحيحًا، وحرّك فاصلة المقسوم بالعدد نفسه من المنازل.');
  const k=D.p,S2=shiftD(N,k);
  q.steps=[k>0?X('Make the divisor a whole number. Move the point in <b>'+dstr(D)+'</b> '+k+' place'+(k>1?'s':'')+' to the right: <b>'+D.v+'</b>.','اجعل المقسوم عليه عددًا صحيحًا. حرّك الفاصلة في <b>'+dstr(D)+'</b> '+k+' من المنازل إلى اليمين: <b>'+D.v+'</b>.')
      :X('The divisor <b>'+D.v+'</b> is already a whole number, so no shifting is needed.','المقسوم عليه <b>'+D.v+'</b> عدد صحيح بالفعل، فلا حاجة إلى تحريك الفاصلة.'),
    k>0?X('Do the SAME move to the dividend: '+dstr(N)+' becomes <b>'+dstr(S2)+'</b>.','افعل الشيء نفسه بالمقسوم: '+eq(dstr(N))+' يصير <b>'+dstr(S2)+'</b>.')
      :X('Keep the decimal point in the answer directly above the decimal point in '+dstr(N)+'.','ضع الفاصلة في ناتج القسمة مباشرة فوق فاصلة '+eq(dstr(N))+'.'),
    X('Divide as usual: '+dstr(S2)+' ÷ '+D.v+' = <b>'+dstr(q.ans)+'</b>.','اقسم كالمعتاد: '+eq(dstr(S2)+' ÷ '+D.v+' = <b>'+dstr(q.ans)+'</b>')+'.'),
    X('Check by multiplying: ','تحقق بالضرب: ')+eq(dstr(q.ans)+' × '+dstr(D)+' = '+dstr(N))+'.'];
  return q;
}

function fracSteps(fs,im,N,Dn,ans,div){
  const s=[];
  const mixed=fs.filter(f=>f.w&&f.n);
  if(mixed.length)s.push(X('Change each mixed number into an improper fraction: ','حوّل كل عدد كسري إلى كسر غير فعلي: ')+mixed.map(f=>showF(f)+' = '+frH(impF(f).n,impF(f).d)).join(X(' and ',' و '))+'.');
  const whole=fs.filter(f=>f.n===0);
  if(whole.length)s.push(X('Write each whole number over 1: ','اكتب كل عدد صحيح فوق 1: ')+whole.map(f=>f.w+' = '+frH(f.w,1)).join(X(' and ',' و '))+'.');
  if(div){
    s.push('<span class="kcf">'+X('<b class="k">Keep</b> '+frH(im[0].n,im[0].d)+' &nbsp;<b class="c">Change</b> ÷ to × &nbsp;<b class="f">Flip</b> '+frH(im[1].n,im[1].d)+' to '+frH(im[1].d,im[1].n)+'.',

/* answer checking. returns {ok}|{partial}|{invalid}|{wrong} */
function checkAnswer(q,v){
  if(q.kind==='dec'){
    const d=parseDec(normDigits(v.a||''));
    if(!d)return{invalid:X('Type a number, like 12.5','اكتب عددًا، مثل 12.5')};
    return eqD(norm(d),q.ans)?{ok:true}:{wrong:true};
  }
  const t=s=>normDigits(s).trim();
  const W=t(v.w),Nn=t(v.n),Dd=t(v.d);
  const isInt=s=>/^\d{1,6}$/.test(s);
  if(W===''&&Nn===''&&Dd==='')return{invalid:X('Type your answer first.','اكتب إجابتك أولًا.')};
  if(W!==''&&!isInt(W)||Nn!==''&&!isInt(Nn)||Dd!==''&&!isInt(Dd))return{invalid:X('Use whole numbers only in the boxes.','استخدم أعدادًا صحيحة فقط في الخانات.')};
  const w=W===''?null:parseInt(W,10);
  if(Nn===''&&Dd===''){return (q.ans.d===1&&q.ans.n===w)?{ok:true}:{wrong:true}}
  if(Nn===''||Dd==='')return{invalid:X('Fill in both the top and the bottom of the fraction.','املأ بسط الكسر ومقامه معًا.')};
  const n=parseInt(Nn,10),d=parseInt(Dd,10);
  if(d===0)return{invalid:X('The bottom number cannot be 0.','لا يمكن أن يكون المقام 0.')};
  const valN=(w||0)*d+n;
  if(valN*q.ans.d!==q.ans.n*d)return{wrong:true};
  const reduced=gcd(n,d)===1||n===0;
  const properMix=w===null||n<d;
  if(!reduced||!properMix)return{partial:X('Right value! Now write it in simplest form (no common factors, and a mixed number needs a fraction less than 1).','القيمة صحيحة! اكتبها الآن في أبسط صورة (بلا عوامل مشتركة، والعدد الكسري يحتاج كسرًا أصغر من 1).')};
  return{ok:true};
}

  return '<table class="lt"><thead><tr><th></th><th>'+X('Player','اللاعب')+'</th><th>'+label+'</th></tr></thead><tbody>'+rows.map((r,i)=>'<tr><td class="rankn">'+(i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1)+'</td><td>'+safeAv(r.avatar)+' '+safeName(r.name)+(r.id===P.id?X(' (you)',' (أنت)'):'')+'</td><td>'+fmtN(safeNum(r[field]))+'</td></tr>').join('')+'</tbody></table>';
}
function liveStanding(){
  if(!QZ||QZ.mode!=='battle')return '';
  const list=Online.here().filter(p=>p.presence.rk===QZ.key).sort((a,b)=>safeNum(b.presence.score)-safeNum(a.presence.score)).slice(0,5);
  if(list.length<2)return '';
  return '<ul class="live">'+list.map((p,i)=>'<li><span class="rankn">'+(i+1)+'</span><span>'+safeAv(p.presence.avatar)+'</span><b>'+safeName(p.presence.name)+(p.isMe?X(' (you)',' (أنت)'):'')+'</b><span class="sp"></span><span>'+X('Q','س')+safeNum(p.presence.qn)+' · '+safeNum(p.presence.score)+'</span></li>').join('')+'</ul>';
}
function updateLive(){
  const a=$('#peerList');if(a)a.innerHTML=peerRows();
  const b=$('#boardList');if(b)b.innerHTML=boardRows(Online.board,'points',X('Points','النقاط'));
  const c=$('#roundList');if(c)c.innerHTML=boardRows(Online.rboard,'score',X('Score','النتيجة'));
  const d=$('#liveStand');if(d)d.innerHTML=liveStanding();
}

function areaModel(cols,sc,rows,sr,mode){
  const cw=44,ch=30,W=cols*cw,H=rows*ch;
  let s='<svg viewBox="0 0 '+(W+4)+' '+(H+4)+'" class="area" role="img" aria-label="Grid showing '+sc+'/'+cols+' of '+sr+'/'+rows+'">';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const inC=c<sc,inR=r<sr;let cls='c0';
    if(mode>=1&&inC&&inR)cls='cb';else if(inC)cls='cc';else if(mode>=1&&inR)cls='cr';
    s+='<rect x="'+(c*cw+2)+'" y="'+(r*ch+2)+'" width="'+cw+'" height="'+ch+'" class="'+cls+'"/>';
  }
  return s+'</svg>';
}

/* ================= quiz engine ================= */
function startQuiz(cfg){
  stopTimers();
  QZ=Object.assign({i:0,qs:[],score:0,correct:0,streak:0,best:0,tries:0,hint:false,fb:null,log:[],done:0,gate:false,hints:false,maxTries:1,count:5},cfg);
  showQ();
}
function showQ(){
  if(!QZ.qs[QZ.i])QZ.qs[QZ.i]=QZ.gen(QZ.i);
  QZ.tries=0;QZ.hint=false;QZ.fb=null;QZ.t0=Date.now();
  QZ.gate=QZ.mode==='duel';
  if(QZ.mode==='battle')Online.presence({state:'playing',qn:QZ.i+1,score:QZ.score,rk:QZ.key});
  if(S.screen!=='quiz')go('quiz');else render();
}
function getVals(){return{a:($('#a1')||{}).value,w:($('#fw')||{}).value,n:($('#fn')||{}).value,d:($('#fd')||{}).value}}
function setMsg(t,cls){const m=$('#msg');if(m){m.textContent=t;m.className='msg '+(cls||'')}}
function calcPts(q,el,tries,hint){
  let base=QZ.mode==='blitz'?50:Math.round(100*LEVELS[q.level-1].mult);
  if(tries>=1)base=Math.round(base*.6);
  if(hint)base=Math.max(10,base-20);
  const speed=(QZ.mode==='duel'||QZ.mode==='battle')?Math.max(0,Math.round(50-el*2.5)):0;
  const streak=QZ.mode==='duel'?0:Math.min(QZ.streak+1,5)*10;
  return base+speed+streak;
}
function submitAnswer(){
  if(!QZ||QZ.fb||QZ.gate)return;
  const q=QZ.qs[QZ.i];
  const r=checkAnswer(q,getVals());
  if(r.invalid){setMsg(r.invalid,'warn');return}
  if(r.partial){setMsg(r.partial,'warn');Snd.play('click');return}
  const el=(Date.now()-QZ.t0)/1000;
  P.solved++;
  if(r.ok){
    const pts=calcPts(q,el,QZ.tries,QZ.hint);
    QZ.streak++;QZ.best=Math.max(QZ.best,QZ.streak);QZ.correct++;QZ.score+=pts;QZ.log[QZ.i]=true;QZ.done++;
    P.correct++;
    if(QZ.mode==='duel'){const p=QZ.players[QZ.i%2];p.score+=pts;p.correct++}else addPoints(pts);
    if(QZ.streak>=5)giveBadge('streak5');
    Snd.play(QZ.streak>=3?'coin':'ok');
    const msgs=isAr()?['صحيح!','أحسنت!','رائع!','أصبت الهدف!','تفكير ذكي!','عمل ممتاز!']:['Correct!','Nice one!','Boom!','You nailed it!','Sharp thinking!','Great work!'];
    QZ.fb={ok:true,msg:msgs[Math.floor(Math.random()*msgs.length)]+(QZ.streak>=3?' 🔥 '+QZ.streak+X(' in a row',' متتالية'):''),pts};
    if(QZ.mode!=='blitz')burst(QZ.streak>=3?40:22);
    save();
    if(QZ.mode==='battle')Online.presence({state:'playing',qn:QZ.i+1,score:QZ.score,rk:QZ.key});
    if(QZ.mode==='blitz'){render();setTimeout(nextQ,350)}else render();
  }else{
    QZ.tries++;QZ.streak=0;
    if(QZ.tries>=QZ.maxTries){
      QZ.log[QZ.i]=false;QZ.done++;save();
      Snd.play('no');
      QZ.fb={ok:false,msg:QZ.maxTries>1?X('Not this time. Study the steps below.','ليس هذه المرة. ادرس الخطوات أدناه.'):X('Not quite.','ليست صحيحة.'),pts:0};
      if(QZ.mode==='battle')Online.presence({state:'playing',qn:QZ.i+1,score:QZ.score,rk:QZ.key});
      if(QZ.mode==='blitz'){render();setTimeout(nextQ,1100)}else render();
    }else{
      Snd.play('no');
      setMsg(X('Not quite. Try again! Tap 💡 Hint for a clue.','ليست صحيحة. حاول مرة أخرى! اضغط 💡 تلميح للمساعدة.'),'warn');
      const c=$('.qcard');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
      const f=$('#a1')||$('#fn')||$('#fw');if(f){f.select&&f.select();f.focus({preventScroll:true})}
    }
  }
}
function nextQ(){
  if(!QZ)return;
  if(QZ.mode==='blitz'&&S.screen!=='quiz')return;
  QZ.i++;
  if(QZ.i>=QZ.count)return finishQuiz();
  showQ();
}
function tickBlitz(force){
  if(!QZ||QZ.mode!=='blitz')return;
  const left=Math.max(0,QZ.timed-(Date.now()-QZ.start)/1000);
  const b=$('#tbar'),n=$('#tnum');
  if(b)b.style.width=(left/QZ.timed*100)+'%';
  if(n){const s=Math.ceil(left);if(n.dataset.s!==String(s)){n.dataset.s=String(s);n.textContent='⏱ '+s;if(s<=10&&s>0&&force!==true)Snd.play('tick')}}
  if(left<=0&&force!==true)finishQuiz();
}
function addHall(mode,score){DB.hall.push({name:P.name,avatar:P.avatar,mode,score,t:Date.now()});DB.hall=DB.hall.sort((a,b)=>b.score-a.score).slice(0,30);save()}
function finishQuiz(){
  stopTimers();
  const m=QZ.mode;
  if(m==='level'){
    const st=QZ.correct>=5?3:QZ.correct>=4?2:QZ.correct>=3?1:0;
    const k=QZ.wid+'-'+QZ.level;
    if(st>(P.stars[k]||0))P.stars[k]=st;
    if(st>0)giveBadge('first');
    if(QZ.correct===QZ.count)giveBadge('perfect');
    if(WORLDS.filter(w=>w.cat==='dec').every(w=>stars(w.id,3)>0))giveBadge('dec');
    if(WORLDS.filter(w=>w.cat==='frac').every(w=>stars(w.id,3)>0))giveBadge('frac');
    save();Online.syncProfile();
    S.result={mode:'level',wi:WORLDS.findIndex(w=>w.id===QZ.wid),lv:QZ.level,stars:st,correct:QZ.correct,count:QZ.count,score:QZ.score,best:QZ.best};
    Snd.play(st>0?'win':'lose');if(st>0)burst(60);
  }else if(m==='blitz'){
    const nb=QZ.score>P.blitz;if(nb)P.blitz=QZ.score;
    if(QZ.correct>=10)giveBadge('blitz');
    addHall('blitz:'+QZ.cat,QZ.score);save();Online.syncProfile();
    S.result={mode:'blitz',score:QZ.score,correct:QZ.correct,done:QZ.done,best:QZ.best,newBest:nb};
    Snd.play('win');burst(50);
  }else if(m==='duel'){
    const a=QZ.players[0],b=QZ.players[1];
    if(a.score!==b.score){giveBadge('duel')}
    addHall('duel',Math.max(a.score,b.score));
    S.result={mode:'duel',players:QZ.players};
    Snd.play('win');burst(60);
  }else{
    giveBadge('battle');
    Online.presence({state:'done',score:QZ.score,qn:QZ.count,rk:QZ.key});
    Online.writeRound(QZ.key,QZ.score,QZ.correct);Online.watchRound(QZ.key);Online.syncProfile();
    addHall('battle',QZ.score);save();
    S.result={mode:'battle',score:QZ.score,correct:QZ.correct,count:QZ.count};
    Snd.play('win');burst(50);
  }
  go('result');
}
function startLevel(wi,lv){
  const w=WORLDS[wi],R=newRng();
  startQuiz({mode:'level',wid:w.id,level:lv,count:5,maxTries:2,hints:true,gen:i=>makeQ(w.id,lv,isWord(lv,i),R)});
}
function startBlitz(){
  const R=newRng(),ws=worldsOf(S.setup.cat),lv=S.setup.diff;
  startQuiz({mode:'blitz',cat:S.setup.cat,count:Infinity,timed:60,start:Date.now(),gen:()=>makeQ(R.pick(ws).id,lv,R.int(0,2)===0,R)});
}
function startDuel(){
  const R=newRng(),ws=worldsOf(S.setup.cat),lv=S.setup.diff;
  const n1=($('#d1')?$('#d1').value:S.setup.p1||P.name).trim()||X('Player 1','اللاعب 1'),n2=($('#d2')?$('#d2').value:S.setup.p2||'').trim()||X('Player 2','اللاعب 2');
  S.setup.p1=n1;S.setup.p2=n2;
  startQuiz({mode:'duel',count:10,players:[{name:n1,avatar:'🔵',score:0,correct:0},{name:n2,avatar:'🟠',score:0,correct:0}],gen:i=>makeQ(R.pick(ws).id,lv,i%3!==0,R)});
}
function startBattle(){
  const a=S.arena,key='r'+a.round+'-d'+a.diff+'-'+a.cat;
  const R=makeRng(hashStr(Online.code+'|'+key)),ws=worldsOf(a.cat);
  const qs=[];for(let i=0;i<10;i++)qs.push(makeQ(R.pick(ws).id,a.diff,a.diff===1?i>=6:i%2===1,R));
  Online.watchRound(key);
  startQuiz({mode:'battle',key,count:10,qs,gen:i=>qs[i]});
}

/* ================= actions ================= */
const ACT={
  home(){go('home')},
  lang(t){DB.prefs.lang=(t&&t.dataset&&t.dataset.v)||(isAr()?'en':'ar');save();applyLang();render()},
  map(){go('map')},
  who(){go('who')},
  pick(t){DB.cur=t.dataset.id;P=DB.profiles[DB.cur];save();go('home')},
  av(t){S.avSel=t.dataset.v;const n=($('#pname')||{}).value||'';render();const i=$('#pname');if(i){i.value=n;i.focus()}},
  create(){const n=($('#pname').value||'').trim();if(!n){$('#pname').focus();toast(X('Type your name first','اكتب اسمك أولًا'));return}newProfile(n,S.avSel);Snd.play('coin');go('home')},
  tmusic(){Snd.setMusic(!DB.prefs.music);render()},
  tsfx(){Snd.setSfx(!DB.prefs.sfx);render()},
  settings(){go('settings')},
  set(t){
    const k=t.dataset.k,v=t.dataset.v;
    if(k==='theme'){DB.prefs.theme=v;save();applyTheme()}
    else if(k==='lang'){DB.prefs.lang=v;save();applyLang()}
    else if(k==='teacher'){DB.prefs.teacher=v==='1';save()}
    else if(k==='cat')S.setup.cat=v;
    else if(k==='diff')S.setup.diff=+v;
    else if(k==='around')S.arena.round=+v;
    else if(k==='acat')S.arena.cat=v;
    else if(k==='adiff')S.arena.diff=+v;
    const d1=$('#d1')?$('#d1').value:null,d2=$('#d2')?$('#d2').value:null;
    if(d1!==null)S.setup.p1=d1;if(d2!==null)S.setup.p2=d2;
    render();
  },
  reset(){if(!S.confirm){S.confirm=true;render();return}P.points=0;P.stars={};P.badges=[];P.blitz=0;P.solved=0;P.correct=0;P.seen={};save();S.confirm=false;toast(X('Progress reset','تمت إعادة الضبط'));render()},
  lesson(t){go('lesson',{lw:+t.dataset.w,lp:0,ls:0})},
  lnext(){if(S.lp===0){S.lp=1;S.ls=0}else if(S.lp===1){const L=LESSONS[WORLDS[S.lw].id];if(S.ls<L.stages.length-1)S.ls++;else S.lp=2}Snd.play('click');render();window.scrollTo(0,0)},
  lprev(){if(S.lp===2){S.lp=1;S.ls=LESSONS[WORLDS[S.lw].id].stages.length-1}else if(S.lp===1){if(S.ls>0)S.ls--;else S.lp=0}render();window.scrollTo(0,0)},
  level(t){startLevel(+t.dataset.w,+t.dataset.l)},
  submit(){submitAnswer()},
  hint(){if(!QZ||QZ.fb)return;QZ.hint=true;setMsg('💡 '+'',' ');const m=$('#msg');if(m){m.innerHTML='💡 '+QZ.qs[QZ.i].hint;m.className='msg'}Snd.play('click')},
  skip(){if(!QZ||QZ.mode!=='blitz'||QZ.fb)return;QZ.streak=0;nextQ()},
  next(){nextQ()},
  ready(){QZ.gate=false;QZ.t0=Date.now();render()},
  quit(){if(QZ&&QZ.mode==='battle')Online.presence({state:'lobby',score:0,qn:0,rk:''});const m=QZ&&QZ.mode;stopTimers();QZ=null;go(m==='level'?'map':m==='blitz'?'blitzsetup':m==='duel'?'duelsetup':m==='battle'?'arena':'home')},
  blitzsetup(){go('blitzsetup')},
  blitzgo(){startBlitz()},
  duelsetup(){go('duelsetup')},
  duelgo(){startDuel()},
  arena(){go('arena');if(Online.status==='checking')Online.init()},
  join(){const c=($('#ccode').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(c.length<3){toast(X('Use 3 or more letters or numbers','استخدم 3 حروف إنجليزية أو أرقام على الأقل'));return}Online.join(c);Snd.play('coin');render()},
  leave(){Online.leave();render()},
  battlego(){startBattle()},
  board(){go('board')},
  fun(){go('fun')},
  punch(){const p=$('#punch');if(p){p.hidden=false;Snd.play('coin')}},
  joke(){S.ji=(S.ji+1)%jokes().length;render()},
  fact(){S.fi=(S.fi+1)%facts().length;render()},
  trivia(){const R=newRng();TV={qs:R.shuffle(TRIVIA_L[li()]).slice(0,5),i:0,score:0,right:0,picked:null,done:false,order:[0,1,2,3]};TV.order=R.shuffle([0,1,2,3]);go('trivia')},
  tans(t){
    if(TV.picked!==null)return;const k=+t.dataset.k,q=TV.qs[TV.i];TV.picked=k;
    if(TV.order[k]===q[2]){TV.score+=20;TV.right++;addPoints(20);Snd.play('ok');burst(20)}else Snd.play('no');
    render();
  },
  tnext(){
    TV.i++;
    if(TV.i>=5){TV.done=true;if(TV.right===5)giveBadge('trivia');Snd.play('win');burst(40)}else{TV.picked=null;TV.order=newRng().shuffle([0,1,2,3])}
    render();window.scrollTo(0,0);
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  Snd.init();
  const f=ACT[t.dataset.a];if(f){if(!['submit','hint','tans','tmusic','tsfx','punch'].includes(t.dataset.a))Snd.play('click');f(t,e)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ans')){e.preventDefault();submitAnswer()}
  else if(e.key==='/'&&e.target.id==='fn'){e.preventDefault();const d=$('#fd');if(d)d.focus()}
  else if(e.key==='Enter'&&e.target.id==='pname'){e.preventDefault();ACT.create()}
  else if(e.key==='Enter'&&e.target.id==='ccode'){e.preventDefault();ACT.join()}
});
document.addEventListener('pointerdown',()=>Snd.init(),{once:true});

/* ================= boot ================= */
/*TESTHOOK*/
applyTheme();
applyLang();
Online.init();
if(P){Snd.music('menu');go('home')}else go('who');
})();
</script>
